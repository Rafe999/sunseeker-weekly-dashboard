<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>科技基金操作与风险看板</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>
:root{--bg:#0b1020;--card:#121a2f;--line:#25304b;--text:#eef3ff;--muted:#93a3bd;--good:#35c48d;--bad:#ff6b6b;--warn:#f6c85f;--accent:#6ea8fe}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1400px;margin:auto;padding:20px}.head{display:flex;justify-content:space-between;gap:15px;align-items:flex-end}.head h1{margin:0;font-size:27px}.sub,.note{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px}.kpi{font-size:22px;font-weight:750}.section{margin-top:18px}.section h2{font-size:18px;margin:0 0 10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.pill{display:inline-block;padding:3px 9px;border-radius:999px;background:#1b2844}.action{border-left:5px solid var(--accent)}.risk{border-left:5px solid var(--bad)}.buy{border-left:5px solid var(--good)}.hold{border-left:5px solid var(--warn)}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:9px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}th{color:#bdc9dc;background:#10182b}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.chart{height:300px}.rule{padding:10px 12px;margin:8px 0;background:#10182b;border-radius:10px}.footer{margin:20px 0;color:var(--muted);font-size:12px}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding:12px}.head{display:block}.head h1{font-size:22px}}</style></head><body><div class="wrap">
<div class="head"><div><h1>科技基金操作与风险看板</h1><div class="sub">025500 / 024481 / 024975 · 操作建议 + 风险提示 + 官方实际</div></div><div class="note">最终净值优先；养基宝仅作盘中估算</div></div>
<div class="grid" id="kpis"></div>
<div class="section two"><div class="card action"><h2>今日操作建议</h2><div id="advice"></div></div><div class="card risk"><h2>风险提示</h2><div id="risk"></div></div></div>
<div class="section"><div class="card"><h2>当前三批建仓规则</h2><div id="rules"></div></div></div>
<div class="section"><h2>三只基金：最新官方实际</h2><div class="table-wrap"><table><thead><tr><th>代码</th><th>中文名称</th><th>持仓</th><th>8/13官方日涨跌</th><th>8/13实际盈亏</th><th>对应主线</th><th>当前建议</th></tr></thead><tbody id="funds"></tbody></table></div></div>
<div class="section three"><div class="card"><h2>8/13板块收盘估算</h2><div id="sectors"></div></div><div class="card"><h2>PPI宏观信号</h2><div id="ppi"></div></div><div class="card"><h2>8月后半段基准情景</h2><div id="aug"></div></div></div>
<div class="section two"><div class="card"><h2>账户总资产 / 累计盈亏</h2><div class="chart"><canvas id="accountChart"></canvas></div></div><div class="card"><h2>决策框架</h2><div id="framework"></div></div></div>
<div class="footer">本页为个人投资决策辅助，不构成保证收益的投资建议。加仓条件以价格行为确认优先，不以单一宏观数据追涨。8/14盘中养基宝数据待下午更新。</div></div>
<script>
let F,A,AC,S;const fmt=n=>Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}),pct=n=>(Number(n)>0?'+':'')+Number(n).toFixed(2)+'%',money=n=>(Number(n)>0?'+':'')+'¥'+fmt(Number(n)),cls=n=>Number(n)>0?'good':Number(n)<0?'bad':'';
async function load(){[F,A,AC,S]=await Promise.all([fetch('./data/forecast.json?'+Date.now()).then(r=>r.json()),fetch('./data/actual.json?'+Date.now()).then(r=>r.json()),fetch('./data/account.json?'+Date.now()).then(r=>r.json()),fetch('./data/third-party-snapshot.json?'+Date.now()).then(r=>r.json())]);render()}
function rec(code,date){return A.records.find(x=>x.code===code&&x.date===date&&x.actualNav!=null)}
function render(){let o=AC.latestOfficialSnapshot||{};kpis.innerHTML=[['最新官方日期',o.date||'—'],['基金账户资产','¥'+fmt(o.fundAccountAssets)],['8/13三只实际盈亏',money(o.trackedFundsDailyPnl)],['估算总资产','¥'+fmt(o.estimatedTotalAssetsUsingPriorCash)],['估算累计盈亏',money(o.estimatedTotalPnlUsingPriorCash)]].map((x,i)=>`<div class="card"><div class="sub">${x[0]}</div><div class="kpi ${i>=2?cls(i===2?o.trackedFundsDailyPnl:o.estimatedTotalPnlUsingPriorCash):''}">${x[1]}</div></div>`).join('');
 advice.innerHTML='<div class="hold"><b>结论：今天暂不减仓；加仓只接受“下跌后止跌确认”，不追高。</b></div><p>8/13出现高开低走：CPO由强转弱，存储与半导体材料/设备尾盘明显弱于指数。PPI偏温和对科技估值是利好，但A股科技未能兑现该利好，说明短线仍有获利盘/估值消化。</p><p><b>第一批：¥3,000–5,000</b>。条件：科技板块回踩后不再创新低，且午后CPO/PCB重新转强、半导体跌幅收窄。优先024481，其次024975，025500只小额。</p><p>若今日直接高开上涨：<b>不追</b>；若持续放量创新低：<b>现金不动</b>。</p>';
 risk.innerHTML='<ul><li><b>估值风险：</b>AI/CPO/半导体仍是高Beta方向，利好兑现后波动会放大。</li><li><b>事件风险：</b>8月下旬Nvidia财报与Jackson Hole可能改变科技风险偏好。</li><li><b>集中度风险：</b>三只基金高度集中于科技链，不能把三只基金视为真正分散。</li><li><b>执行风险：</b>不要因为一天上涨/下跌改变三批资金计划。</li></ul>';
 rules.innerHTML='<div class="rule"><b>第一批 ¥3,000–5,000：</b>回踩止跌确认后使用。</div><div class="rule"><b>第二批 ¥8,000：</b>主线重新突破前高、量价配合后使用。</div><div class="rule"><b>第三批 ¥10,000：</b>等待8月下旬海外AI产业验证后再决定。</div><div class="rule"><b>战略现金约¥8,000：</b>不预设必须投入，专门应对二次深调。</div>';
let names={};F.funds.forEach(f=>names[f.code]=f.name);let recs=A.records.filter(x=>x.date===o.date);funds.innerHTML=F.funds.map(f=>{let r=rec(f.code,o.date);let advice=f.code==='024481'?'第一优先加仓':f.code==='024975'?'等待止跌后小额':'持有，不追涨';return `<tr><td><b>${f.code}</b></td><td>${f.name}</td><td>¥${fmt(f.holding)}</td><td class="${cls(r?.dailyChangePct)}">${r?pct(r.dailyChangePct):'—'}</td><td class="${cls(r?.holdingPnl)}">${r?money(r.holdingPnl):'—'}</td><td>${f.exposure||'科技'}</td><td>${advice}</td></tr>`}).join('');
let sec=S.additionalSectorSnapshot||{};sectors.innerHTML=Object.entries(sec).filter(([k,v])=>typeof v==='number').map(([k,v])=>`<div class="rule"><b>${k}</b>：<span class="${cls(v)}">${pct(v)}</span></div>`).join('')||'<div class="note">等待今日养基宝更新</div>';
ppi.innerHTML='<p><b>7月PPI：环比0.0%，低于市场预期。</b></p><p>含义：通胀压力相对温和，有利于利率预期与成长股估值；但不能单独作为A股科技加仓信号。</p><p class="note">本页把PPI作为宏观因子，而不是买卖触发器。</p>';
aug.innerHTML='<p><b>基准：震荡偏强</b></p><p>8月后半段更可能是板块轮动，而不是单边上涨。CPO/PCB相对优先；存储与半导体材料设备等回踩后的赔率更重要。</p><p>若海外AI财报/利率环境继续支持科技，二次加速概率上升；若高估值方向放量破位，则延后第三批。</p>';
framework.innerHTML='<div class="rule">宏观利好 ≠ 立即买入</div><div class="rule">板块下跌 ≠ 自动抄底</div><div class="rule">优先等待“跌幅收窄 + 不创新低 + 主线转强”</div><div class="rule">官方净值用于复盘；养基宝用于盘中决策</div>';
renderChart()}
function renderChart(){let dates=[...new Set(A.records.map(r=>r.date))].sort();let shares=AC.estimatedSharesFromSnapshot||{};let h=dates.map(d=>{let rows=F.funds.map(f=>rec(f.code,d)).filter(Boolean);if(rows.length<3)return null;let mv=0;F.funds.forEach(f=>{let r=rec(f.code,d),sh=Number(shares[f.code]||0);mv+=sh?sh*Number(r.actualNav):Number(f.holding)*Number(r.actualNav)/Number(f.baseNav)});let total=Number(AC.cash)+mv+Number(AC.latestThirdPartySnapshot?.otherResidualAssets||0);return{d,total,pnl:total-Number(AC.initialCapital)}}).filter(Boolean);new Chart(document.getElementById('accountChart'),{type:'line',data:{labels:h.map(x=>x.d.slice(5)),datasets:[{label:'总资产',data:h.map(x=>x.total),borderWidth:3,tension:.2},{label:'累计盈亏',data:h.map(x=>x.pnl),borderWidth:2,tension:.2}]},options:{maintainAspectRatio:false,scales:{y:{grid:{color:'#25304b'}},x:{grid:{color:'#25304b'}}},plugins:{legend:{labels:{color:'#dce6fa'}}}}})}
load();</script></body></html>
