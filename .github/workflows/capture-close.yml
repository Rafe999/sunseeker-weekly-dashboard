name: Capture fund close estimates
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/capture-close.yml'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python investment-dashboard/update_close.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add investment-dashboard/data/close-estimate.json
          git commit -m 'Capture fund close estimates' || exit 0
          git push
