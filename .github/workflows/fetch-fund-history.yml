name: Fetch fund history
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-fund-history.yml'
permissions:
  contents: write
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch history
        shell: python
        run: |
          import json, urllib.request, urllib.parse, pathlib
          root=pathlib.Path('investment-dashboard/data')
          codes=['025500','024481','024975']
          out={}
          for code in codes:
              qs=urllib.parse.urlencode({'fundCode':code,'pageIndex':1,'pageSize':20,'startDate':'2026-08-05','endDate':'2026-08-12'})
              url='https://api.fund.eastmoney.com/f10/lsjz?'+qs
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':f'https://fundf10.eastmoney.com/jjjz_{code}.html'})
              data=json.loads(urllib.request.urlopen(req,timeout=20).read().decode('utf-8'))
              rows=[]
              for r in ((data.get('Data') or {}).get('LSJZList') or []):
                  rows.append({'date':r.get('FSRQ'),'nav':float(r['DWJZ']) if r.get('DWJZ') else None,'dailyChangePct':float(r['JZZZL']) if r.get('JZZZL') not in (None,'') else None})
              out[code]=sorted(rows,key=lambda x:x['date'])
          (root/'history.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add investment-dashboard/data/history.json
          git commit -m 'Update fund history' || exit 0
          git push
